<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold"><i class="fa-solid fa-users-rectangle me-2"></i>GESTIONAR CONSEJO COMUNAL</h2>
    <div class="search-box">
      <input type="text" class="form-control rounded-pill" placeholder="Buscar...">
    </div>
  </div>

  
  <div class="card shadow-sm border-0 p-4 mb-5 bg-white">
    <h5 class="fw-bold mb-3 text-uppercase" style="font-size: 0.9rem; letter-spacing: 1px;">Nuevo Registro</h5>
    <form (submit)="createCouncil($event)">
      <div class="row g-3">
        <div class="col-md-3">
          <input type="text" name="councilName" class="form-control bg-light border-0 py-2" placeholder="Nombre del Consejo" required>
        </div>
        <div class="col-md-2">
          <select name="cityId" class="form-select bg-light border-0 py-2" required>
            <option value="" disabled selected>Ciudad</option>
            <option *ngFor="let city of cities" [value]="city.cityId">{{ city.cityName }}</option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="comunityId" class="form-select bg-light border-0 py-2" required>
            <option value="" disabled selected>Comunidad</option>
            <option *ngFor="let com of comunities" [value]="com.comunityId">{{ com.comunityName }}</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="text" name="googleMaps" class="form-control bg-light border-0 py-2" placeholder="URL Ubicación">
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-dark w-100 fw-bold py-2 shadow-sm">
            <i class="fa-solid fa-save me-2"></i>Guardar
          </button>
        </div>
      </div>
    </form>
  </div>

 
  <div class="card shadow-sm border-0" *ngIf="councils && councils.length > 0; else noData">
    <div class="table-responsive">
      <table class="table table-hover mb-0 text-center">
        <thead class="bg-light">
          <tr>
            <th class="py-3">Nombre</th>
            <th class="py-3">Comunidad</th>
            <th class="py-3">Ubicación</th>
            <th class="py-3">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of councils">
            <td class="align-middle text-uppercase small fw-bold">{{item.councilName}}</td>
            <td class="align-middle">{{item.comunityName}}</td>
            <td class="align-middle">
                <a *ngIf="item.googleMaps" [href]="item.googleMaps" target="_blank" class="btn btn-sm btn-light rounded-pill">Ver mapa</a>
                <span *ngIf="!item.googleMaps" class="text-muted small">N/A</span>
            </td>
            <td class="align-middle">
              <button class="btn btn-link text-primary p-0 me-3" (click)="openEditModal(item)" data-bs-toggle="modal" data-bs-target="#editModal">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn btn-link text-danger p-0" (click)="deleteCouncil(item.councilId)">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <ng-template #noData>
    <div class="text-center py-5 bg-white rounded shadow-sm border">
        <i class="fa-solid fa-folder-open fa-3x text-muted mb-3"></i>
        <p class="text-muted mb-0">No se encontraron consejos registrados actualmente.</p>
    </div>
  </ng-template>
</div>


<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Editar Consejo</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4" *ngIf="councilSelect">
        <div class="mb-3">
          <label class="form-label small fw-bold">Nombre del Consejo</label>
          <input type="text" name="editName" class="form-control" [(ngModel)]="councilSelect.councilName">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Ciudad</label>
          <select name="editCity" class="form-select" [(ngModel)]="councilSelect.cityId">
            <option *ngFor="let city of cities" [value]="city.cityId">{{ city.cityName }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Comunidad</label>
          <select name="editComunity" class="form-select" [(ngModel)]="councilSelect.comunityId">
            <option *ngFor="let com of comunities" [value]="com.comunityId">{{ com.comunityName }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Google Maps (URL)</label>
          <input type="text" name="editMaps" class="form-control" [(ngModel)]="councilSelect.googleMaps">
        </div>
        <button class="btn btn-dark w-100 fw-bold py-2 mt-2" (click)="updateCouncil()" data-bs-dismiss="modal">
          <i class="fa-solid fa-rotate me-2"></i>Actualizar Registro
        </button>
      </div>
    </div>
  </div>
</div>
