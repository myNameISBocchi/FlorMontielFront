<div class="container-fluid py-3 py-md-4 px-3 px-lg-5">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded gap-3 gap-md-0">
    <h4 class="mb-0">Gestión de Roles</h4>
    <div class="w-100" style="max-width: 300px;">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
          <i class="fas fa-search text-muted"></i>
        </span>
        <input type="text" class="form-control border-start-0 ps-0 rounded-end-pill" placeholder="Buscar..." style="box-shadow: none;">
      </div>
    </div>
  </div>

  @if(authService.hasPrivilege('roles.store')){
    <div class="card shadow-sm border-0 mb-4 bg-white">
      <div class="card-body p-3">
        <h6 class="fw-bold mb-3 text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.5px;">Nuevo Registro</h6>
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-6 mb-2 mb-md-0">
            <input type="text" class="form-control form-control-sm bg-light border-0" placeholder="Nombre del Rol" [(ngModel)]="currentRole.roleName">
          </div>
          <div class="col-12 col-md-2">
            <button class="btn btn-danger btn-sm w-100 fw-bold shadow-sm" (click)="saveRole()">
              <i class="fa-solid fa-floppy-disk"></i> Guardar
            </button>
          </div>
        </div>
      </div>
    </div>
  }

  <div class="d-none d-md-block" *ngIf="roles && roles.length > 0; else noData">
    <div class="card shadow-sm border-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover mb-0 text-center align-middle" style="font-size: 0.85rem;">
          <thead class="bg-light text-muted text-uppercase">
            <tr>
              <th class="py-2 border-0">Nombre</th>
              <th class="py-2 border-0">Estado</th>
              <th class="py-2 border-0">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let role of roles">
              <td class="small fw-bold text-dark">{{ role.roleName }}</td>
              <td>
                <span class="badge" [ngClass]="role.blocked ? 'bg-secondary' : 'bg-success'">
                  {{ role.blocked ? 'En uso' : 'Disponible' }}
                </span>
              </td>
              <td>
                <button class="btn btn-link text-primary btn-sm px-2 py-1 me-1" (click)="openModal(role)" data-bs-toggle="modal" data-bs-target="#editModal">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="btn btn-link text-danger btn-sm px-2 py-1" (click)="deleteRole(role)" [disabled]="role.blocked">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="d-md-none" *ngIf="roles && roles.length > 0">
    <div class="row g-3">
      <div class="col-12" *ngFor="let role of roles">
        <div class="card shadow-sm border-0">
          <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <h6 class="fw-bold text-dark mb-1" style="font-size: 0.9rem;">{{ role.roleName }}</h6>
              </div>
              <span class="badge" [ngClass]="role.blocked ? 'bg-secondary' : 'bg-success'">
                {{ role.blocked ? 'En uso' : 'Disponible' }}
              </span>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-3 pt-2 border-top">
              <button class="btn btn-outline-primary btn-sm" (click)="openModal(role)" data-bs-toggle="modal" data-bs-target="#editModal">
                <i class="fa-solid fa-pen-to-square me-1"></i>Editar
              </button>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteRole(role)" [disabled]="role.blocked">
                <i class="fa-solid fa-trash-can me-1"></i>Eliminar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noData>
    <div class="text-center py-4 px-3 bg-white rounded shadow-sm border">
      <i class="fa-solid fa-folder-open fa-2x text-light mb-2"></i>
      <p class="text-muted small mb-0">No hay roles registrados actualmente.</p>
    </div>
  </ng-template>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white py-2">
        <h6 class="modal-title">Editar Rol</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" style="font-size: 0.7rem;"></button>
      </div>
      <div class="modal-body p-3">
        <div class="mb-2">
          <label class="form-label mb-1" style="font-size: 0.75rem; font-weight: 600;">Nombre del Rol</label>
          <input type="text" class="form-control form-control-sm" [(ngModel)]="currentRole.roleName">
        </div>
        <button class="btn btn-danger btn-sm w-100 fw-bold" (click)="saveRole()" data-bs-dismiss="modal">
          <i class="fa-solid fa-rotate me-1"></i>Actualizar
        </button>
      </div>
    </div>
  </div>
</div>
