<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
    
    <div class="card-header bg-white border-0 py-3 px-4 d-flex align-items-center">
      <i class="bi bi-chevron-left me-2" style="cursor: pointer;"></i>
      <h4 class="mb-0 fw-bold text-secondary">Registrar Voceros</h4>
    </div>

    <div class="card-body bg-light p-4">
      <form [formGroup]="personForm" (ngSubmit)="onSubmit()">
        <div class="row g-4">
          
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Nombre:</label>
            <input type="text" class="form-control form-control-lg shadow-sm" formControlName="firstName" placeholder="Ej. Alfonso">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Correo:</label>
            <input type="email" class="form-control form-control-lg shadow-sm" formControlName="email" placeholder="ejemplo@correo.com">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Apellido:</label>
            <input type="text" class="form-control form-control-lg shadow-sm" formControlName="lastName" placeholder="Ej. Espina">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Contraseña:</label>
            <input type="password" class="form-control form-control-lg shadow-sm" formControlName="password" placeholder="********">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Cédula:</label>
            <input type="text" class="form-control form-control-lg shadow-sm" formControlName="identification" placeholder="V-31478490">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Teléfono:</label>
            <input type="text" class="form-control form-control-lg shadow-sm" formControlName="phone" placeholder="0414-0000000">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Ciudad:</label>
            <select class="form-select form-select-lg shadow-sm" formControlName="cityId">
              <option value="">Seleccione la ciudad</option>
              <option *ngFor="let c of city" [value]="c.cityId">{{c.cityName}}</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Fecha De Nacimiento:</label>
            <input type="date" class="form-control form-control-lg shadow-sm" formControlName="date">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Comunidad:</label>
            <select class="form-select form-select-lg shadow-sm" formControlName="comunityId">
              <option value="">Seleccione la comunidad</option>
              <option *ngFor="let c of comunity" [value]="c.comunityId">{{c.comunityName}}</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Comité:</label>
            <select class="form-select form-select-lg shadow-sm" formControlName="committeeId">
              <option value="">Seleccione el comité</option>
              <option *ngFor="let c of committee" [value]="c.committeeId">{{c.committeeName}}</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Consejo Comunal:</label>
            <select class="form-select form-select-lg shadow-sm" formControlName="councilId">
              <option value="">Seleccione el consejo</option>
              <option *ngFor="let c of council" [value]="c.councilId">{{c.councilName}}</option>
            </select>
          </div>

        </div>

        <div class="mt-5 text-center">
          <button type="submit" class="btn btn-primary btn-lg px-5 py-2 rounded-3 shadow" [disabled]="personForm.invalid">
            Registrar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
