<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
    <h2 class="text-dark fw-bold mb-0">
      <i class="fa-solid fa-house-user"></i>GESTION DE COMUNAS
    </h2>
    <span class="badge bg-secondary rounded-pill px-3 py-2 fs-6">
      {{comunity.length}} Comunidades Activas
    </span>
  </div>

  <div class="card border-0 shadow-sm mb-5">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-4 text-dark text-uppercase small ls-2">Nuevo Registro</h5>
      <form (submit)="createComunity($event)" class="row g-3 align-items-center">
        <div class="col-md-5">
          <div class="form-floating">
            <input type="text" class="form-control border-0 bg-light" id="comName" name="comunityName" placeholder="Nombre" required>
            <label for="comName">Nombre de la Comunidad</label>
          </div>
        </div>
        <div class="col-md-5">
          <div class="form-floating">
            <input type="text" class="form-control border-0 bg-light" id="comMaps" name="googleMaps" placeholder="Ubicación" required>
            <label for="comMaps">Coordenadas / Ubicación</label>
          </div>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-danger py-3 shadow-sm fw-bold">
            <i class="fa-solid fa-plus me-1"></i>Añadir
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="row">
    @for(item of comunity; track item.comunityId) {
      <div class="col-auto mb-4">
        <div class="comunity-card">
          <div class="img-wrapper">
            <img [src]="'http://localhost/app-back/public/' + item.photoComunity" alt="comunidad">
          </div>
          
          <div class="card-info">
            <h5 class="title">{{item.comunityName}}</h5>
            <p class="location">
              <i class="fa-solid fa-location-dot"></i> {{item.googleMaps}}
            </p>
          </div>

          <div class="card-actions">
            <button class="action-btn edit" data-bs-toggle="modal" data-bs-target="#editModal" (click)="openModalButton(item)">
              <i class="fa-solid fa-pen"></i>
            </button>
            
            <label [for]="'file-' + item.comunityId" class="action-btn view">
              <i class="fa-solid fa-camera"></i>
            </label>
            <input type="file" [id]="'file-' + item.comunityId" hidden (change)="onFileSelected($event, item.comunityId)">
            
            <button class="action-btn delete" (click)="deleteComunity(item.comunityId)">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-secondary text-white">
        <h5 class="modal-title fw-bold" id="editModalLabel">Actualizar Comunidad</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form *ngIf="comunitySelect" (submit)="updateComunity($event)">
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Nombre de la Comunidad</label>
            <input type="text" class="form-control bg-light border-0" [(ngModel)]="comunitySelect.comunityName" name="editName" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Ubicación / Google Maps</label>
            <input type="text" class="form-control bg-light border-0" [(ngModel)]="comunitySelect.googleMaps" name="editMaps" required>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-danger px-4 shadow-sm" data-bs-dismiss="modal">
            Actualizar Registro
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
